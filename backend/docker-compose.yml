version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: educart_db
    restart: always
    environment:
      POSTGRES_USER: educart_user
      POSTGRES_PASSWORD: educart_password
      POSTGRES_DB: educart_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educart_user -d educart_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: educart_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_URL=postgresql://educart_user:educart_password@db:5432/educart_db
      - SECRET_KEY=educart_super_secret_jwt_key_change_in_production_2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

networks:
  default:
    name: educart_network
